navigationCompose = "2.9.1"
playServicesAuth = "21.3.0" # Or the latest version
lifecycleViewmodelCompose = "2.9.1" # Or the latest version
lifecycleRuntimeCompose = "2.9.1"
agp = "8.10.1"
